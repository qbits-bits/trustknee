# See https://pre-commit.com for more information
# To install hooks for both pre-commit and commit-msg:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # 1. Enforce Conventional Commits (https://www.conventionalcommits.org/en/v1.0.0/)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [
          "feat",
          "fix",
          "docs",
          "style",
          "refactor",
          "perf",
          "test",
          "build",
          "ci",
          "chore",
          "revert",
        ]

  # 2. General Git & File Hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # 3. Python Linting and Formatting via Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # 4. Jupyter Notebook Cleanliness
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
